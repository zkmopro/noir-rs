[package]
name = "noir"
version = "1.0.0-beta.19"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
acvm = { git = "https://github.com/noir-lang/noir.git", rev = "v1.0.0-beta.19" }
acvm_blackbox_solver = { git = "https://github.com/noir-lang/noir.git", rev = "v1.0.0-beta.19" }
base64 = "0.22.0"
bincode = "1.3.3"
bn254_blackbox_solver = { git = "https://github.com/noir-lang/noir.git", rev = "v1.0.0-beta.19" }
flate2 = "1.0.28"
hex = "0.4.3"
# Fix to address a breaking change not following semver guidelines
# TODO: remove when updating to a new version of Noir that supports this new change
keccak = "=0.2.0-rc.0"
nargo = { git = "https://github.com/noir-lang/noir.git", rev = "v1.0.0-beta.19" }
reqwest = { version = "0.12.1", default-features = false, features = [
    "blocking",
    "rustls-tls",
] }
serde = { version = "1.0.197", features = ["derive"] }
thiserror = "1.0.58"
tracing = "0.1"
tracing-subscriber = "0.3"
serde_json = "1.0.125"
clap = { version = "4.4.8", features = ["derive"] }

# Optional dependencies
barretenberg-rs = { version = "=4.2.0-aztecnr-rc.2", default-features = false, features = ["ffi"], optional = true }

[features]
default = []
barretenberg = ["barretenberg-rs"]
srs-downloader = ["barretenberg"]
ios-build = ["barretenberg"]
android-build = ["barretenberg"]

[[bin]]
name = "srs_downloader"
path = "src/bin/srs_downloader.rs"
required-features = ["srs-downloader"]

[dev-dependencies]
tempfile = "3.8.1"
