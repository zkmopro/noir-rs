            # Cache Cargo build artifacts
            - name: Cache Cargo build
              uses: actions/cache@v4
              with:
                  path: |
                      target/
                      bb/target/
                      noir/target/
                  key: ${{ runner.os }}-x86_64-cargo-build-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/*.rs') }}
                  restore-keys: |
